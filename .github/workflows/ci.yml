name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node-version: [20, 22]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: npm

      - run: npm ci

      - name: Syntax check
        run: |
          node --check index.js
          node --check http-api.js
          node --check client.js

      - name: Unit tests
        run: node --test test/*.test.mjs

      - name: Sanitization gate (must be 0 hits)
        run: node scripts/sanitize-check.mjs

      - name: Verify package contents
        run: npm pack --dry-run
