# 专家团（Expert Panel v5.0）· 多轮评审唯一流程
#
# 唯一的执行流程：① 独立取证（多位专家并行只读）→ ② 交叉互审（互审官收敛）→ ③ 终裁定稿（终裁专家下发指派单）。
# 已移除「单专家接管 / 主会话原地接管」等旁路模式；第 ③ 轮可通过 enableArbiter 关闭。
#
# 这里只放纯行为开关，不预置任何 provider / model：
# 装好后在「设置 → 专家团 → 设置」里选阵容（不知道有哪些路由可先用 /expert routes 查看）；
# 未配置时 /expert 与 consult_expert_panel 会明确提示先去配置，不会使用任何隐式默认模型。
- insert:
    - id: expert-panel
      name: 'dsh-expert-panel'
      config:
        enableArbiter: true
        requireApproval: true
        maxStepsPerExpert: 30
        expertTimeoutSeconds: 1800
